# Yazi config — open editable files in micro on Enter.
[opener]
edit = [
  { run = 'micro "$@"', desc = "Edit (micro)", block = true, for = "windows" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { name = "*.env", use = "edit" },
  { name = "*.json", use = "edit" },
  { name = "*.md", use = "edit" },
  { name = "*.toml", use = "edit" },
  { name = "*.yaml", use = "edit" },
  { name = "*.yml", use = "edit" },
  { name = "*.js", use = "edit" },
  { name = "*.ts", use = "edit" },
  { name = "*.py", use = "edit" },
  { name = "*.ps1", use = "edit" },
  { name = "*.txt", use = "edit" },
  { name = "*.cfg", use = "edit" },
  { name = "*.ini", use = "edit" },
]
